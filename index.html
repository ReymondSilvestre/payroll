<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARK Payroll</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="style.css" rel="stylesheet"></head><body>
<div id="lg" class="d-flex justify-content-center align-items-center" style="min-height:100vh;background:#000"><form class="card card-h p-4" style="width:340px" onsubmit="return login(event)">

<div id="pr"></div>
<script src="app.js"></script>
